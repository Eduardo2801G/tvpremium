<script>
  // Quita la animación del DOM cuando termina
  document.getElementById('splash').addEventListener('animationend', function (e) {
    if (e.animationName === 'splashOut') this.remove();
  });
</script>

<header>
  <h1>GOLVYX <span>TV</span></h1>
  <input id="q" type="search" placeholder="Buscar canal…" autocomplete="off">
</header>
<nav id="cats"></nav>
<main>
  <div id="grid"></div>
  <button id="more" hidden>Mostrar más</button>
  <p id="empty" hidden>No hay canales aquí.</p>
</main>

<section id="player" hidden>
  <div id="stage"></div>
  <div id="side">
    <input id="dq" type="search" placeholder="Buscar canal…" autocomplete="off" aria-label="Buscar canal">
    <div id="dock" aria-label="Lista de canales"></div>
  </div>
  <div id="hud">
    <button id="back" aria-label="Volver">←</button>
    <div id="info"><b id="pname"></b><small id="pstatus"></small></div>
    <button id="fav" aria-label="Favorito">☆</button>
    <button id="prev" aria-label="Canal anterior">▲</button>
    <button id="next" aria-label="Canal siguiente">▼</button>
  </div>
</section>
