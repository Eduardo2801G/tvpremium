name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias (copia hls.js y genera canales.js)
        run: npm install

      - name: Generar proyecto Android
        run: npx cap add android

      - name: Parchear manifiesto para Android TV
        run: python3 scripts/patch_manifest.py

      - name: Parchear MainActivity (autoplay y toque nativo)
        run: python3 scripts/patch_activity.py

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GOLVYX-TV-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk